<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- iPad向け：拡大禁止・ノッチの内側まで描画する -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- ホーム画面に追加したとき、アドレスバーなしの全画面で開く -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="80周年抽選会">
<title>新興窯業株式会社 80周年記念抽選会</title>

<style>
/* =================================================================
   iPad版 抽選アプリ — 見た目の定義
   ================================================================= */

:root{
  --navy1:#1a1a2e;      /* 背景（上） */
  --navy2:#16213e;      /* 背景（下） */
  --gold:#B8902F;       /* ゴールド（主） */
  --gold2:#C9A548;      /* ゴールド（副） */
  --gold3:#D4A548;      /* ゴールド（明るめ） */
  --cream:#F8F5ED;      /* 文字 */
  /* 明朝を先に置く。Georgia を先頭にすると数字が旧スタイル（8o のように高さが揃わない）
     になってしまうため、PC版と同じ順番にしてある。 */
  --mincho: "游明朝", "Yu Mincho", YuMincho, "Hiragino Mincho ProN",
            Georgia, "Times New Roman", "MS PMincho", serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html, body{
  height:100%;
  overflow:hidden;                    /* スクロールのバウンドを止める */
  overscroll-behavior:none;
}

body{
  position:fixed; inset:0;            /* 指でページ全体が動かないように固定 */
  background:linear-gradient(160deg, var(--navy1) 0%, var(--navy2) 100%);
  color:var(--cream);
  font-family:var(--mincho);
  /* 誤操作防止：文字選択・長押しメニュー・ダブルタップ拡大を無効化 */
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* 画面（3種類を切り替えて使う）
   高さは --vh（キーボードを除いた実際に見えている高さ）を使う。
   これを inset:0 のままにすると、キーボードが出たときにボタンが隠れて押せなくなる。 */
.screen{
  position:absolute; top:0; left:0; right:0;
  height:var(--vh, 100%);
  display:none;
  flex-direction:column;
  align-items:center;
  /* ノッチ・ホームバーを避ける */
  padding: max(16px, env(safe-area-inset-top))
           max(16px, env(safe-area-inset-right))
           max(16px, env(safe-area-inset-bottom))
           max(16px, env(safe-area-inset-left));
}
.screen.active{ display:flex; }

/* ---------------- 共通パーツ ---------------- */

/* 大きめのゴールドボタン（指で押しやすいサイズ） */
.btn{
  font-family:var(--mincho);
  font-size:clamp(20px, 3.2vmin, 30px);
  letter-spacing:.18em;
  color:var(--gold3);
  background:rgba(184,144,47,.10);
  border:1.5px solid var(--gold);
  border-radius:9999px;
  padding:0 clamp(28px, 6vmin, 60px);
  min-height:clamp(60px, 9vmin, 84px);   /* 60pt以上を確保 */
  min-width:clamp(180px, 34vmin, 300px);
  display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:transform .12s ease, background .12s ease;
}
.btn:active{ transform:scale(.96); background:rgba(184,144,47,.24); }
.btn.primary{
  background:linear-gradient(180deg, rgba(212,165,72,.30), rgba(184,144,47,.14));
  color:var(--cream);
  border-color:var(--gold3);
}
.btn.quiet{
  font-size:clamp(16px, 2.4vmin, 22px);
  min-height:clamp(52px, 7.5vmin, 68px);
  min-width:clamp(130px, 24vmin, 200px);
  color:var(--gold2);
}
.btn[disabled]{ opacity:.35; pointer-events:none; }

/* 会社名（画面下部に控えめに）。
   絶対配置にして、中央の内容の位置に影響を与えないようにする。 */
.footer{
  position:absolute;
  left:0; right:0;
  bottom:max(14px, env(safe-area-inset-bottom));
  font-size:clamp(11px, 1.7vmin, 16px);
  letter-spacing:.28em;
  color:rgba(248,245,237,.42);
  text-align:center;
  pointer-events:none;         /* 下端の文字がボタンのタップを邪魔しないように */
}
/* キーボードが出ている間は会社名を隠す（ボタンと重ならないように） */
body.keyboard .footer{ display:none; }

/* 隅の小さなボタン（音量・リセット） */
.corner{
  position:absolute; top:max(10px, env(safe-area-inset-top));
  display:flex; align-items:center; justify-content:center;
  width:52px; height:52px;
  border-radius:50%;
  border:1px solid rgba(184,144,47,.35);
  background:rgba(255,255,255,.03);
  color:rgba(212,165,72,.75);
  font-size:20px;
  cursor:pointer;
  z-index:20;
}
.corner:active{ background:rgba(184,144,47,.2); }
#btnSound{ left:max(10px, env(safe-area-inset-left)); }
#btnReset{ right:max(10px, env(safe-area-inset-right)); }
#btnReset.holding{ background:rgba(184,144,47,.45); }

/* ================= 初期設定画面 ================= */

/* キーボードで高さが足りなくなったときの保険として、この画面だけスクロールを許す */
#setup{
  justify-content:center;
  gap:clamp(10px, 2.2vmin, 26px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.title{
  text-align:center;
  letter-spacing:.3em;
  line-height:1.9;
  color:var(--gold3);
  font-size:clamp(15px, 2.6vmin, 24px);
}
.title strong{
  display:block;
  font-weight:normal;
  font-size:clamp(24px, 4.6vmin, 44px);
  color:var(--cream);
  letter-spacing:.22em;
}

.lead{
  font-size:clamp(14px, 2.2vmin, 20px);
  letter-spacing:.16em;
  color:rgba(248,245,237,.75);
  margin-top:clamp(10px, 3vmin, 34px);
}

/* 人数の増減（キーボードを使わないので、iPadでの事故が起きない） */
.stepper{
  display:flex; align-items:center; justify-content:center;
  gap:clamp(16px, 3.4vmin, 36px);
}
.step{
  width:clamp(66px, 10vmin, 92px);
  height:clamp(66px, 10vmin, 92px);
  border-radius:50%;
  border:1.5px solid var(--gold);
  background:rgba(184,144,47,.10);
  color:var(--gold3);
  font-family:var(--mincho);
  font-size:clamp(30px, 5vmin, 44px);
  line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  -webkit-user-select:none; user-select:none;
}
.step:active{ background:rgba(184,144,47,.3); transform:scale(.94); }
.step[disabled]{ opacity:.28; pointer-events:none; }

#maxVal{
  font-size:clamp(52px, 10vmin, 100px);
  line-height:1;
  color:var(--cream);
  min-width:2.6em;
  text-align:center;
  font-variant-numeric:tabular-nums;
}

/* JavaScriptが動いているかの確認表示（本番前に消します） */
#jsCheck{
  position:absolute;
  bottom:max(38px, calc(env(safe-area-inset-bottom) + 26px));
  left:0; right:0;
  text-align:center;
  font-size:clamp(10px, 1.5vmin, 14px);
  letter-spacing:.12em;
  color:#E8A0A0;
  pointer-events:none;
}
#jsCheck.ok{ color:rgba(120,200,150,.7); }

.note{
  font-size:clamp(12px, 1.9vmin, 17px);
  letter-spacing:.12em;
  color:rgba(248,245,237,.5);
  min-height:1.6em;
  text-align:center;
}
.note.error{ color:#E8A0A0; }

/* ================= 抽選画面 ================= */

#main{ justify-content:center; }

/* 順位（第5位 など） */
#rank{
  font-size:clamp(26px, 5.4vmin, 56px);
  letter-spacing:.28em;
  color:var(--gold3);
  text-align:center;
  padding-left:.28em;               /* letter-spacing の分を戻して中央に見せる */
}

/* 数字を映す枠。※横方向には切り取らない（数字が見切れる原因になるため） */
#reelBox{
  margin:clamp(10px, 2.6vmin, 32px) 0;
  width:min(88vw, 760px);
  height:clamp(190px, 58vh, 520px);
  border-top:1px solid rgba(184,144,47,.5);
  border-bottom:1px solid rgba(184,144,47,.5);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
#reelBox::before, #reelBox::after{     /* 上下の淡いフェード（スロットらしさ） */
  content:''; position:absolute; left:0; right:0; height:22%;
  pointer-events:none;
}
#reelBox::before{ top:0;    background:linear-gradient(to bottom, rgba(22,33,62,.9), transparent); }
#reelBox::after { bottom:0; background:linear-gradient(to top,    rgba(22,33,62,.9), transparent); }

/* ---- 回転中のスロット ----
   縦だけを切り取り、横は切り取らない（overflow:hidden だと数字の左右が欠けるため）。
   上下は薄くフェードさせて、中央の1つがはっきり見えるようにする。 */
#reelViewport{
  position:absolute; inset:0;
  overflow:visible;
  clip-path:inset(0 -50vw);
  -webkit-mask-image:linear-gradient(to bottom, transparent 1%, #000 30%, #000 70%, transparent 99%);
          mask-image:linear-gradient(to bottom, transparent 1%, #000 30%, #000 70%, transparent 99%);
  display:none;
}
#reelBox.reeling #reelViewport{ display:block; }
#reelBox.reeling #number{ visibility:hidden; }

#reelStrip{
  position:absolute; left:0; right:0; top:0;
  will-change:transform;
}
.reel-cell{
  display:flex; align-items:center; justify-content:center;
  line-height:1;
  color:var(--cream);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
  white-space:nowrap;
}

/* 確定した数字を、少しズームして見せる */
#number.win{ animation:winzoom .55s cubic-bezier(.18,.7,.2,1.1) both; }
@keyframes winzoom{
  0%{   transform:scale(.62); opacity:.4; }
  58%{  transform:scale(1.07); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}

/* ---- 当選確定の白フラッシュ ---- */
#flash{
  position:absolute; inset:0; z-index:25;
  background:#fff; opacity:0; pointer-events:none;
}
#flash.on{ animation:flashfade .55s ease-out; }
@keyframes flashfade{ 0%{ opacity:.72; } 100%{ opacity:0; } }

/* ---- 紙吹雪（第1位） ---- */
#confetti{
  position:absolute; inset:0; z-index:24;
  width:100%; height:100%;
  pointer-events:none;
  display:none;
}
#confetti.on{ display:block; }

/* 数字の大きさは桁数で変える。
   3桁になっても左右が見切れないよう、3桁のときだけ少し小さくする。 */
#number{
  font-size:min(52vh, 48vw, 460px);    /* 1〜2桁（ふだんはこちら） */
  line-height:1;
  color:var(--cream);
  letter-spacing:.02em;
  font-variant-numeric:tabular-nums;   /* 桁がぶれない */
  text-shadow:0 0 50px rgba(212,165,72,.35);
  white-space:nowrap;
}
#number[data-len="3"]{ font-size:min(44vh, 42vw, 400px); }
#number.win{ color:var(--gold3); text-shadow:0 0 70px rgba(212,165,72,.7); }
/* まだ回していないときの「—」は、小さく淡く出す（※必ず上の指定より後に置く） */
#number.idle{
  font-size:min(9vh, 11vw, 80px);
  color:rgba(248,245,237,.22);
  text-shadow:none;
}

/* ボタンを置く場所（高さを固定して、切り替わってもレイアウトが揺れないように） */
#controls{
  display:flex; gap:clamp(12px, 2.4vmin, 26px);
  flex-wrap:wrap; justify-content:center; align-items:center;
  min-height:clamp(72px, 11vmin, 100px);
}

/* ================= 完了画面 ================= */

#done{ justify-content:center; gap:clamp(12px, 2.4vmin, 30px); }
#doneMsg{
  text-align:center;
  font-size:clamp(24px, 4.6vmin, 50px);
  letter-spacing:.3em;
  padding-left:.3em;
  color:var(--gold3);
  line-height:1.6;
}
#doneSub{
  font-size:clamp(13px, 2vmin, 19px);
  letter-spacing:.2em;
  color:rgba(248,245,237,.55);
}

/* 当選番号の一覧（第1位から順に並べる） */
#resultList{
  display:flex; flex-direction:column;
  width:min(84vw, 620px);
}
.result-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:1em;
  padding:clamp(4px, 1vmin, 12px) clamp(12px, 2.4vmin, 28px);
  border-bottom:1px solid rgba(184,144,47,.25);
}
.result-row:last-child{ border-bottom:none; }
.r-rank{
  font-size:clamp(15px, 2.6vmin, 26px);
  letter-spacing:.2em;
  color:rgba(248,245,237,.7);
  white-space:nowrap;
}
.r-num{
  font-size:clamp(30px, 5.6vmin, 62px);
  line-height:1.25;
  color:var(--cream);
  font-variant-numeric:tabular-nums;
}
/* 第1位だけ大きく・ゴールドで */
.result-row.top{ border-bottom:1px solid rgba(184,144,47,.5); }
.result-row.top .r-rank{ color:var(--gold2); font-size:clamp(17px, 3vmin, 30px); }
.result-row.top .r-num{
  color:var(--gold3);
  font-size:clamp(40px, 7.6vmin, 88px);
  text-shadow:0 0 40px rgba(212,165,72,.55);
}

/* ================= 確認ダイアログ ================= */

#dlgBack{
  position:absolute; inset:0; z-index:30;
  display:none; align-items:center; justify-content:center;
  background:rgba(10,12,24,.78);
  padding:24px;
}
#dlgBack.active{ display:flex; }
#dlg{
  max-width:min(88vw, 560px);
  background:linear-gradient(160deg, #1e2440, #182036);
  border:1px solid var(--gold);
  border-radius:18px;
  padding:clamp(24px, 4.5vmin, 44px);
  text-align:center;
}
#dlgText{
  font-size:clamp(16px, 2.6vmin, 24px);
  line-height:2;
  letter-spacing:.1em;
  margin-bottom:clamp(20px, 3.4vmin, 34px);
}
#dlgText b{ color:var(--gold3); font-size:1.35em; font-weight:normal; }
.dlg-btns{ display:flex; gap:16px; justify-content:center; }
/* ダイアログ内は2つ横並びに収まる幅にする（縦向きでも折り返さない） */
.dlg-btns .btn{ min-width:clamp(120px, 20vmin, 190px); padding:0 clamp(18px, 3vmin, 34px); }
</style>
</head>
<body>

<!-- 当選確定の白フラッシュ／紙吹雪（第1位） -->
<div id="flash"></div>
<canvas id="confetti"></canvas>

<!-- 隅の小さなボタン（抽選画面・完了画面でのみ表示） -->
<div class="corner" id="btnSound" title="音のON/OFF">♪</div>
<div class="corner" id="btnReset" title="最初からやり直す（長押し）">⏻</div>


<!-- ================= 初期設定画面 ================= -->
<div class="screen active" id="setup">
  <div class="title">
    新興窯業株式会社
    <strong>80周年記念抽選会</strong>
  </div>

  <div class="lead">参加人数</div>
  <!-- キーボードを使わず、＋／− で人数を決める（長押しで早く動きます） -->
  <div class="stepper">
    <button class="step" id="btnMinus">−</button>
    <div id="maxVal">15</div>
    <button class="step" id="btnPlus">＋</button>
  </div>
  <div class="note" id="setupNote">1 〜 15 番の中から抽選します</div>

  <button class="btn primary" id="btnStartApp">はじめる</button>

  <div class="footer">新興窯業株式会社　80周年記念抽選会</div>
  <div id="jsCheck">起動確認：JavaScript が動いていません</div>
</div>


<!-- ================= 抽選画面 ================= -->
<div class="screen" id="main">
  <div id="rank">第 5 位</div>

  <div id="reelBox">
    <!-- 回転中はこちら（数字が縦に流れるスロット） -->
    <div id="reelViewport"><div id="reelStrip"></div></div>
    <!-- 確定したらこちら（大きな数字） -->
    <div id="number">—</div>
  </div>

  <div id="controls">
    <button class="btn primary" id="btnSpin">スタート</button>
    <button class="btn primary" id="btnStop" style="display:none">ストップ</button>
    <button class="btn quiet"   id="btnRedraw" style="display:none">再抽選</button>
    <button class="btn primary" id="btnNext"   style="display:none">次へ</button>
  </div>

  <div class="footer">新興窯業株式会社　80周年記念抽選会</div>
</div>


<!-- ================= 完了画面 ================= -->
<div class="screen" id="done">
  <div id="doneMsg">抽選結果</div>
  <div id="resultList"></div>
  <div id="doneSub">ありがとうございました</div>
  <div class="footer">新興窯業株式会社　80周年記念抽選会</div>
</div>


<!-- ================= 確認ダイアログ ================= -->
<div id="dlgBack">
  <div id="dlg">
    <div id="dlgText"></div>
    <div class="dlg-btns">
      <button class="btn quiet" id="dlgNo">やめる</button>
      <button class="btn primary" id="dlgYes">はい</button>
    </div>
  </div>
</div>


<script>
/* =================================================================
   iPad版 抽選アプリ — ステップ2（ルーレット演出と音）
   -----------------------------------------------------------------
   出来ること：
     ・参加人数を入れて、第5位 → 第1位まで5回ぶん抽選できる
     ・5種類のルーレット演出（後半ほど盛り上がる固定順）と効果音
     ・第1位は紙吹雪とファンファーレ
     ・再抽選（辞退）、リザルト画面、リセット
   まだ入っていないもの：
     ・進行状況の自動保存、ホーム画面追加＋オフライン対応
   ================================================================= */

const APP_VERSION = 'ipad-step2';

// ---- 画面の要素をまとめて取得 ------------------------------------
const $ = (id) => document.getElementById(id);
const scSetup = $('setup'), scMain = $('main'), scDone = $('done');
const elMaxVal = $('maxVal'), setupNote = $('setupNote');
const btnMinus = $('btnMinus'), btnPlus = $('btnPlus');
const elRank = $('rank'), elNumber = $('number');
const btnSpin = $('btnSpin'), btnStop = $('btnStop'),
      btnRedraw = $('btnRedraw'), btnNext = $('btnNext');
const btnSound = $('btnSound'), btnReset = $('btnReset');
const dlgBack = $('dlgBack'), dlgText = $('dlgText'),
      dlgYes = $('dlgYes'), dlgNo = $('dlgNo');

// ---- 抽選の状態 --------------------------------------------------
// round は 0〜4。順位は 5 - round（0回目＝第5位、4回目＝第1位）。
const state = {
  max: 0,          // 参加人数
  round: 0,        // 今が何回目か
  pool: [],        // まだ当たっていない番号
  winners: [],     // [{rank, num}]
  declined: [],    // 辞退した番号（以降ずっと対象外）
  phase: 'idle'    // idle / spinning / result
};

let soundOn = true;

// 回ごとの演出（ステップ2で実際に使う。今は割り当てだけ用意しておく）
const PATTERNS = ['smooth', 'standard', 'stay', 'tease', 'double'];

const rankOf = (round) => 5 - round;


/* =================================================================
   ▼ ルーレットの「着地の軌道」計算
   PC版で完成した式をそのまま使っています。映像と音がこの同じ式を共有するので、
   タメや擬似連のタイミングがぴったり合います。
   ================================================================= */

// パターンごとに「減速中に余分に流す数字の数」。
//   長く見せたいパターンは、減速をゆっくりにする（＝押した瞬間に止まって見える）のではなく、
//   流す数字を増やして長さを出す。
const REEL_EXTRA = { smooth: 30, tease: 18 };
function reelExtraCells(pattern){ return REEL_EXTRA[pattern] || 0; }

const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);        // 強めの減速
const easeOutDecel = (t) => 1 - Math.pow(1 - t, 1.5);      // 出だしが回転速度と同じ、緩やかな減速
const easeOutBack  = (t) => { const c1 = 1.4, c3 = c1 + 1; // 行き過ぎて戻る＝着地のバウンド感
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function reelPattern(name, i0, f2, f1, w){
  const S = (t0, t1, from, to, ease) => ({ t0, t1, from, to, ease });
  if (name === 'smooth')        // なめらか停止（タメ無し）
    return [ S(0, 1, i0, w, 'decel') ];
  if (name === 'double')        // 2ため
    return [ S(0, 0.300, i0, f2, 'decel'), S(0.300, 0.357, f2, f2, 'lin'),
             S(0.357, 0.614, f2, f1, 'cubic'), S(0.614, 0.686, f1, f1, 'lin'),
             S(0.686, 1, f1, w, 'back') ];
  if (name === 'tease')         // ロング（長く回して1回タメ）
    return [ S(0, 0.53, i0, f1, 'decel'), S(0.53, 0.66, f1, f1, 'lin'),
             S(0.66, 1, f1, w, 'back') ];
  if (name === 'stay')          // 行くと見せかけ → 行かない
    return [ S(0, 0.365, i0, w, 'decel'),          // 当選番号で止まったように見せる
             S(0.365, 0.460, w, w, 'lin'),         // 止まった…
             S(0.460, 0.708, w, w + 0.6, 'cubic'), // 次へ行く!?
             S(0.708, 1, w + 0.6, w, 'cubic') ];   // …行かない！戻って確定
  // standard：1ため
  return [ S(0, 0.446, i0, f1, 'decel'), S(0.446, 0.538, f1, f1, 'lin'),
           S(0.538, 1, f1, w, 'back') ];
}

function reelEvalSegs(segs, p){
  for (const s of segs){
    if (p <= s.t1 || s === segs[segs.length - 1]){
      let lt = (p - s.t0) / (s.t1 - s.t0);
      lt = Math.min(1, Math.max(0, lt));
      const e = s.ease === 'cubic' ? easeOutCubic(lt)
              : s.ease === 'decel' ? easeOutDecel(lt)
              : s.ease === 'back'  ? easeOutBack(lt) : lt;
      return s.from + (s.to - s.from) * e;
    }
  }
  return segs[segs.length - 1].to;
}

// 時間 t（ミリ秒）での「中央に来ている数字の位置」を返す関数を作る
function makeTrajectory(pattern, iStart, fake2Idx, fakeIdx, winnerIdx, delay, duration){
  const iAtDelay = iStart + delay / 60;       // 全速は「1セル＝60ms」
  const segs = reelPattern(pattern, iAtDelay, fake2Idx, fakeIdx, winnerIdx);
  return function (t){
    if (t < delay) return iStart + t / 60;    // まだ全速で回転中
    let p = (t - delay) / duration;
    if (!(p >= 0)) p = 1;                     // NaN 対策
    if (p > 1) p = 1;
    return reelEvalSegs(segs, p);
  };
}

// 各演出の長さ（ミリ秒）
const REEL_DURATION = { standard: 6760, double: 9520, tease: 8660, smooth: 5760, stay: 7946 };


/* =================================================================
   ▼ スロット表示（1列）
   ================================================================= */
const Reel = (function(){
  const box = $('reelBox'), strip = $('reelStrip');
  let pool = [0], cellH = 0, font = 0, pos = 0, nums = [], spinning = false;
  let spinRaf = null, landRaf = null, landTimer = null;

  const rand = () => pool[Math.floor(Math.random() * pool.length)];

  // セルの高さは JS の計算値をそのまま px 指定する。
  //   CSS任せにすると計算値と実寸がわずかにズレて、流した枚数ぶん誤差が積み上がるため。
  function metrics(){
    const h = box.clientHeight || 300;
    const w = box.clientWidth  || 400;
    cellH = h / 2.4;                                  // 中央の数字を大きく見せる
    const digits = String(pool[pool.length - 1] || 1).length;
    const byHeight = cellH * 0.84;
    const byWidth  = (w * 0.92) / Math.max(1, digits * 0.62);
    font = Math.max(24, Math.min(byHeight, byWidth));
  }

  function render(){
    let html = '';
    for (let i = 0; i < nums.length; i++){
      html += '<div class="reel-cell" data-i="' + i + '" style="height:' + cellH +
              'px;font-size:' + font + 'px">' + nums[i] + '</div>';
    }
    strip.innerHTML = html;
  }

  function stopAll(){
    spinning = false;
    cancelAnimationFrame(spinRaf);
    cancelAnimationFrame(landRaf);
    if (landTimer){ clearTimeout(landTimer); landTimer = null; }
    box.classList.remove('reeling');
  }

  // 連続回転スタート
  function startSpin(p){
    stopAll();
    pool = (p && p.length) ? p.slice().sort((a, b) => a - b) : [0];
    metrics();
    nums = []; for (let k = 0; k < 6; k++) nums.push(rand());
    pos = 0; render();
    box.classList.add('reeling');
    spinning = true;
    const v = cellH / 60;                    // 1セル＝60ms
    let last = performance.now();
    function loop(now){
      if (!spinning) return;
      let dt = now - last; last = now;
      if (dt > 100) dt = 100;                // フレームが飛んだときの暴走防止
      pos += v * dt;
      let guard = 0;
      while (cellH > 0 && pos >= cellH && guard++ < 300){
        pos -= cellH;
        nums.shift(); nums.push(rand()); render();
      }
      strip.style.transform = 'translateY(' + (-pos) + 'px)';
      spinRaf = requestAnimationFrame(loop);
    }
    spinRaf = requestAnimationFrame(loop);
  }

  // 減速して当選番号に着地
  function land(winner, pattern, duration, onDone){
    spinning = false;
    cancelAnimationFrame(spinRaf);
    cancelAnimationFrame(landRaf);
    if (landTimer){ clearTimeout(landTimer); landTimer = null; }

    // 「今見えている3つ」＋「流す数字」＋「ハズレ2つ・当選・1つ」の順に並べる
    const visible = nums.slice(0, 3);
    const fillers = [];
    for (let i = 0; i < 30 + reelExtraCells(pattern); i++) fillers.push(rand());
    let fake = rand(), g = 0;
    while (fake === winner && pool.length > 1 && g++ < 30) fake = rand();
    let fake2 = rand(); g = 0;
    while ((fake2 === winner || fake2 === fake) && pool.length > 2 && g++ < 30) fake2 = rand();
    nums = visible.concat(fillers, [fake2, fake, winner, rand()]);
    render();

    const winnerIdx = nums.length - 2;
    const traj = makeTrajectory(pattern, 1 + pos / cellH,
                                nums.length - 4, nums.length - 3, winnerIdx, 0, duration);
    const start = performance.now();
    let done = false;

    function finish(){
      if (done) return; done = true;
      cancelAnimationFrame(landRaf);
      if (landTimer){ clearTimeout(landTimer); landTimer = null; }
      strip.style.transform = 'translateY(' + (-(winnerIdx - 1) * cellH) + 'px)';
      box.classList.remove('reeling');
      if (onDone) onDone();
    }
    function frame(now){
      if (done) return;
      let t = now - start;
      if (!(t >= 0)) t = duration;
      if (t > duration) t = duration;
      strip.style.transform = 'translateY(' + (-(traj(t) - 1) * cellH) + 'px)';
      if (t < duration) landRaf = requestAnimationFrame(frame); else finish();
    }
    landRaf = requestAnimationFrame(frame);
    // 保険：アニメが止まっても、時間＋2秒で必ず当選番号に着地させる
    landTimer = setTimeout(finish, duration + 2000);
  }

  // 画面の向きが変わったときにセルの大きさを取り直す
  function relayout(){
    if (!nums.length) return;
    const prev = cellH;
    metrics();
    if (prev > 0) pos = pos * (cellH / prev);
    render();
  }

  return { startSpin, land, stopAll, relayout };
})();


/* =================================================================
   ▼ 音（すべて合成音。外部ファイル不要なのでオフラインでも確実に鳴る）
   ================================================================= */
const Sound = (function(){
  let ctx = null, silent = null;

  function ensureCtx(){
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // iPadの消音スイッチ対策：ほぼ無音のトラックを鳴らし続けて再生セッションを確保する
  function silentTrack(){
    const sr = 8000, n = sr;                     // 1秒ぶん
    const buf = new ArrayBuffer(44 + n);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128 + (i % 2));   // 聞こえない程度の微小信号
    const u8 = new Uint8Array(buf);
    let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return 'data:audio/wav;base64,' + btoa(s);
  }

  function tone(freq, start, dur, type, vol){
    if (!soundOn) return;
    const c = ensureCtx(), osc = c.createOscillator(), gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, c.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(vol || 0.2, c.currentTime + start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.02);
  }

  function noiseBurst(vol){
    if (!soundOn) return;
    const c = ensureCtx();
    const len = Math.floor(c.sampleRate * 0.05);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
    const g = c.createGain(); g.gain.value = vol || 0.25;
    src.connect(hp).connect(g).connect(c.destination);
    src.start();
  }

  // ルーレットの「カチッ」。電子的なビープではなく、歯車が1つ進むような機械音。
  //   ①バンドパスした短いノイズ（芯のあるカチ）＋②低い胴鳴り（トッ）
  function reelTick(){
    if (!soundOn) return;
    const c = ensureCtx(), t = c.currentTime;
    const len = Math.floor(c.sampleRate * 0.025);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 2400 + Math.random() * 300; bp.Q.value = 1.4;
    const gN = c.createGain();
    gN.gain.setValueAtTime(0.45, t);
    gN.gain.exponentialRampToValueAtTime(0.0008, t + 0.025);
    src.connect(bp).connect(gN).connect(c.destination);
    src.start(t);

    const osc = c.createOscillator(), gO = c.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(330, t);
    osc.frequency.exponentialRampToValueAtTime(150, t + 0.03);
    gO.gain.setValueAtTime(0.15, t);
    gO.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    osc.connect(gO).connect(c.destination);
    osc.start(t); osc.stop(t + 0.06);
  }

  let reelTimer = null;
  function startReelSpin(){
    ensureCtx();
    if (reelTimer) return;
    reelTimer = setInterval(reelTick, 60);      // 回転と同じテンポ（1セル＝60ms）
  }
  function stopReelSpin(){
    if (reelTimer){ clearInterval(reelTimer); reelTimer = null; }
  }

  function playStop(){ noiseBurst(0.5); tone(180, 0, 0.25, 'triangle', 0.4); }

  function playWin(){                            // 上昇する3音
    tone(523, 0.00, 0.18, 'sine', 0.3);
    tone(659, 0.12, 0.18, 'sine', 0.3);
    tone(784, 0.24, 0.30, 'sine', 0.35);
  }

  function playFanfare(){                        // 第1位用
    const seq = [523, 523, 523, 523, 659, 784, 1047];
    const tms = [0, 0.15, 0.30, 0.45, 0.62, 0.80, 1.02];
    seq.forEach((f, i) => tone(f, tms[i], i === seq.length - 1 ? 0.7 : 0.16, 'triangle', 0.3));
  }

  // 最初のタップで呼ぶ（iOSはタッチ前に音を鳴らせない）
  function unlock(){
    try{
      ensureCtx();
      if (!silent){
        silent = new Audio(silentTrack());
        silent.loop = true;
        silent.setAttribute('playsinline', '');
        silent.play().catch(() => {});
      }
    }catch(err){ /* 音が使えなくても抽選は続けられる */ }
  }

  return { unlock, reelTick, startReelSpin, stopReelSpin, playStop, playWin, playFanfare };
})();

// 着地中のクリック音。映像とまったく同じ軌道を計算し、
//   数字が1つ中央に進むたびに1回鳴らす（減速・タメに自然に同期する）。
let landingClickRAF = null;
function startLandingClicks(pattern, duration){
  cancelAnimationFrame(landingClickRAF);
  // 並びは「見えている3つ＋流す(30+余分)＋4つ」なので、当選は末尾から2番目
  const winnerIdx = 35 + reelExtraCells(pattern);
  const traj = makeTrajectory(pattern, 1, winnerIdx - 2, winnerIdx - 1, winnerIdx, 0, duration);
  const start = performance.now();
  let lastCell = 1;
  function loop(now){
    let t = now - start; if (t > duration) t = duration;
    const cell = Math.floor(traj(t));
    if (cell !== lastCell){ lastCell = cell; Sound.reelTick(); }
    if (t < duration) landingClickRAF = requestAnimationFrame(loop);
  }
  landingClickRAF = requestAnimationFrame(loop);
}
function stopLandingClicks(){ cancelAnimationFrame(landingClickRAF); }


/* =================================================================
   ▼ 白フラッシュと紙吹雪（第1位）
   ================================================================= */
let flashTimer = null;
function fireFlash(){
  const f = $('flash');
  f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  // 別アプリに切り替わるとCSSアニメも止まるので、時間が来たら確実に消す
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => f.classList.remove('on'), 1000);
}

const Confetti = (function(){
  const cv = $('confetti');
  const cx = cv.getContext('2d');
  let raf = null, parts = [], endAt = 0, safety = null;
  const COLORS = ['#D4A548', '#C9A548', '#B8902F', '#F0E2B8', '#FFFFFF'];

  function start(){
    stop();
    cv.classList.add('on');            // 先に表示してからサイズを測る（隠れていると 0 になる）
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = cv.clientWidth || window.innerWidth;
    const H = cv.clientHeight || window.innerHeight;
    cv.width  = W * dpr;
    cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    parts = [];
    for (let i = 0; i < 170; i++){
      parts.push({
        // 画面の上側にばらけて配置し、すぐに降ってくるようにする
        x: Math.random() * W, y: -20 - Math.random() * H,
        w: 5 + Math.random() * 8, h: 9 + Math.random() * 12,
        vy: 200 + Math.random() * 300, vx: -50 + Math.random() * 100,
        rot: Math.random() * Math.PI, vr: -3 + Math.random() * 6,
        color: COLORS[Math.floor(Math.random() * COLORS.length)]
      });
    }
    endAt = performance.now() + 6000;
    let last = performance.now();
    function loop(now){
      let dt = (now - last) / 1000; last = now;
      if (dt > 0.08) dt = 0.08;
      cx.clearRect(0, 0, W, H);
      for (const p of parts){
        p.y += p.vy * dt; p.x += p.vx * dt; p.rot += p.vr * dt;
        if (p.y > H + 30){ p.y = -20; p.x = Math.random() * W; }
        cx.save();
        cx.translate(p.x, p.y); cx.rotate(p.rot);
        cx.fillStyle = p.color; cx.globalAlpha = .9;
        cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cx.restore();
      }
      if (now < endAt) raf = requestAnimationFrame(loop);
      else stop();
    }
    raf = requestAnimationFrame(loop);
    clearTimeout(safety);
    safety = setTimeout(stop, 8000);      // 念のための打ち切り
  }

  function stop(){
    cancelAnimationFrame(raf); raf = null;
    clearTimeout(safety); safety = null;
    cv.classList.remove('on');
    if (cx) cx.clearRect(0, 0, cv.width, cv.height);
  }

  return { start, stop };
})();


/* -----------------------------------------------------------------
   画面の切り替え
   ----------------------------------------------------------------- */
function showScreen(name){
  [scSetup, scMain, scDone].forEach(s => s.classList.remove('active'));
  ({ setup: scSetup, main: scMain, done: scDone })[name].classList.add('active');
  // 隅のボタンは初期設定画面では隠す
  const inGame = (name !== 'setup');
  btnSound.style.display = inGame ? 'flex' : 'none';
  btnReset.style.display = inGame ? 'flex' : 'none';
}


/* -----------------------------------------------------------------
   初期設定画面
   ----------------------------------------------------------------- */
const MAX_MIN = 5, MAX_MAX = 999;   // 5回抽選するので最低5人
let maxInput = 15;                  // 参加人数（既定値）

function refreshSetupNote(){
  elMaxVal.textContent = maxInput;
  setupNote.textContent = `1 〜 ${maxInput} 番の中から抽選します`;
  btnMinus.disabled = (maxInput <= MAX_MIN);
  btnPlus.disabled  = (maxInput >= MAX_MAX);
}

function changeMax(delta){
  maxInput = Math.min(MAX_MAX, Math.max(MAX_MIN, maxInput + delta));
  refreshSetupNote();
}

// ＋／− は、押しっぱなしにすると連続で動く（人数が多いときのため）
function bindStep(btn, delta){
  let repeatTimer = null, accelTimer = null;
  const start = (e) => {
    e.preventDefault();
    changeMax(delta);
    // 500ms 押し続けたら連続、さらに続けると速くなる
    accelTimer = setTimeout(() => {
      repeatTimer = setInterval(() => changeMax(delta), 110);
      accelTimer = setTimeout(() => {
        clearInterval(repeatTimer);
        repeatTimer = setInterval(() => changeMax(delta), 40);
      }, 1600);
    }, 500);
  };
  const end = () => { clearTimeout(accelTimer); clearInterval(repeatTimer); };
  btn.addEventListener('touchstart', start, { passive:false });
  btn.addEventListener('mousedown', start);
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => btn.addEventListener(ev, end));
}
bindStep(btnMinus, -1);
bindStep(btnPlus,  +1);

function startApp(){
  state.max = maxInput;
  state.round = 0;
  state.pool = Array.from({ length: maxInput }, (_, i) => i + 1);
  state.winners = [];
  state.declined = [];

  unlockAudio();          // iOSは「最初のタッチ」で音を有効にする必要がある
  requestWakeLock();      // 画面が消えないようにする
  beginRound();
  showScreen('main');
}

// キーボードが閉じる拍子にタップが空振りすることがあるので、
// click だけでなく touchend でも受け取る（連続発火は 500ms でまとめて無視）。
let lastStartApp = 0;
function startAppOnce(){
  const now = Date.now();
  if (now - lastStartApp < 500) return;
  lastStartApp = now;
  startApp();
}
$('btnStartApp').addEventListener('click', startAppOnce);
$('btnStartApp').addEventListener('touchend', startAppOnce);


/* -----------------------------------------------------------------
   抽選画面
   ----------------------------------------------------------------- */

// 1回ぶんの準備（順位を表示して、待機状態にする）
function beginRound(){
  state.phase = 'idle';
  Reel.stopAll();
  stopLandingClicks();
  Sound.stopReelSpin();
  Confetti.stop();
  elRank.textContent = `第 ${rankOf(state.round)} 位`;
  elNumber.textContent = '—';
  elNumber.classList.remove('win');
  elNumber.classList.add('idle');
  updateButtons();
}

// 数字を表示する。桁数をCSSに伝えて、3桁でも見切れないようにする。
function setNumber(v){
  elNumber.textContent = v;
  elNumber.dataset.len = String(v).length;
}

// 当選番号の一覧（第1位から順に）を組み立てる
function renderResult(){
  const list = $('resultList');
  list.innerHTML = '';
  state.winners.slice().sort((a, b) => a.rank - b.rank).forEach(w => {
    const row = document.createElement('div');
    row.className = 'result-row' + (w.rank === 1 ? ' top' : '');
    const rank = document.createElement('span');
    rank.className = 'r-rank';
    rank.textContent = `第 ${w.rank} 位`;
    const num = document.createElement('span');
    num.className = 'r-num';
    num.textContent = w.num;
    row.append(rank, num);
    list.appendChild(row);
  });
}

function updateButtons(){
  const p = state.phase;
  btnSpin.style.display   = (p === 'idle')     ? 'inline-flex' : 'none';
  btnStop.style.display   = (p === 'spinning') ? 'inline-flex' : 'none';
  btnRedraw.style.display = (p === 'result')   ? 'inline-flex' : 'none';
  btnNext.style.display   = (p === 'result')   ? 'inline-flex' : 'none';
  btnNext.textContent = (state.round >= 4) ? '終了' : '次へ';
}

function startSpin(){
  if (state.phase !== 'idle') return;
  if (state.pool.length === 0){ alert('抽選できる番号が残っていません'); return; }
  state.phase = 'spinning';
  elNumber.classList.remove('win', 'idle');
  updateButtons();
  Reel.startSpin(state.pool);
  Sound.startReelSpin();
}

function stopSpin(){
  if (state.phase !== 'spinning') return;
  state.phase = 'landing';        // 演出中はボタンを出さない（誤操作防止）
  updateButtons();
  Sound.stopReelSpin();

  // ストップを押した瞬間に、残っている番号から公正に1つ選ぶ
  const idx = Math.floor(Math.random() * state.pool.length);
  const winner = state.pool[idx];
  state.pool.splice(idx, 1);
  const rank = rankOf(state.round);
  state.winners.push({ rank, num: winner });

  // この回の演出（第5位から順に、後半ほど盛り上がる固定順）
  const pattern  = PATTERNS[state.round];
  const duration = REEL_DURATION[pattern];

  startLandingClicks(pattern, duration);
  Reel.land(winner, pattern, duration, () => {
    stopLandingClicks();
    setNumber(winner);
    elNumber.classList.remove('idle', 'win');
    void elNumber.offsetWidth;              // アニメを確実に再生させる
    elNumber.classList.add('win');
    fireFlash();
    Sound.playStop();
    if (rank === 1){                        // 第1位だけ紙吹雪とファンファーレ
      Confetti.start();
      setTimeout(() => Sound.playFanfare(), 280);
    } else {
      setTimeout(() => Sound.playWin(), 200);
    }
    state.phase = 'result';
    updateButtons();
  });
}

btnSpin.addEventListener('click', startSpin);
btnStop.addEventListener('click', stopSpin);

// --- 再抽選（辞退） ---
btnRedraw.addEventListener('click', () => {
  if (state.phase !== 'result') return;
  const last = state.winners[state.winners.length - 1];
  confirmDialog(
    `第 ${last.rank} 位の当選番号<br><b>${last.num}</b><br>を辞退として、もう一度抽選しますか？`,
    () => {
      state.winners.pop();
      state.declined.push(last.num);   // 以降の回でも二度と出さない（プールに戻さない）
      beginRound();
    }
  );
});

// --- 次へ ---
btnNext.addEventListener('click', () => {
  if (state.phase !== 'result') return;
  if (state.round >= 4){ renderResult(); showScreen('done'); return; }
  state.round++;
  beginRound();
});


/* -----------------------------------------------------------------
   確認ダイアログ
   ----------------------------------------------------------------- */
let dlgCallback = null;
function confirmDialog(html, onYes){
  dlgText.innerHTML = html;
  dlgCallback = onYes;
  dlgBack.classList.add('active');
}
dlgYes.addEventListener('click', () => {
  dlgBack.classList.remove('active');
  const cb = dlgCallback; dlgCallback = null;
  if (cb) cb();
});
dlgNo.addEventListener('click', () => {
  dlgBack.classList.remove('active');
  dlgCallback = null;
});


/* -----------------------------------------------------------------
   隅のボタン
   ----------------------------------------------------------------- */

// 音のON/OFF
btnSound.addEventListener('click', () => {
  soundOn = !soundOn;
  if (!soundOn) Sound.stopReelSpin();
  else if (state.phase === 'spinning') Sound.startReelSpin();
  btnSound.textContent = soundOn ? '♪' : '×';
  btnSound.style.opacity = soundOn ? '1' : '.45';
});

// リセットは「2秒長押し」。誤タップでは発動しない。
let holdTimer = null;
function holdStart(e){
  e.preventDefault();
  btnReset.classList.add('holding');
  holdTimer = setTimeout(() => {
    btnReset.classList.remove('holding');
    confirmDialog('抽選を最初からやり直しますか？<br>これまでの結果は消えます。', () => {
      Reel.stopAll();
      stopLandingClicks();
      Sound.stopReelSpin();
      Confetti.stop();
      state.phase = 'idle';
      showScreen('setup');
      refreshSetupNote();
    });
  }, 2000);
}
function holdEnd(){
  btnReset.classList.remove('holding');
  clearTimeout(holdTimer);
}
btnReset.addEventListener('touchstart', holdStart, { passive:false });
btnReset.addEventListener('mousedown',  holdStart);
['touchend','touchcancel','mouseup','mouseleave'].forEach(ev =>
  btnReset.addEventListener(ev, holdEnd));


/* -----------------------------------------------------------------
   iPad対策
   ----------------------------------------------------------------- */

// ピンチ拡大を無効化（Safariの独自イベント）
['gesturestart','gesturechange','gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false }));

/* 画面の高さを「キーボードを除いた、実際に見えている高さ」に合わせる。
   これをしないと、キーボードが出たときに下のボタンが隠れて押せなくなる。 */
function applyViewportHeight(){
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', h + 'px');
  // キーボードが出ているかどうか（高さが1割以上縮んだら出ていると判断）
  const keyboardOpen = !!vv && (window.innerHeight - vv.height > window.innerHeight * 0.1);
  document.body.classList.toggle('keyboard', keyboardOpen);
  Reel.relayout();
}
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', applyViewportHeight);
  window.visualViewport.addEventListener('scroll', applyViewportHeight);
}
window.addEventListener('resize', applyViewportHeight);
window.addEventListener('orientationchange', () => setTimeout(applyViewportHeight, 300));
applyViewportHeight();

// 画面が消えないようにする（iPadOS 16.4以降のSafariで有効）
let wakeLock = null;
async function requestWakeLock(){
  try{
    if ('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(err){ /* 使えない環境では何もしない（手動で自動ロックをオフにする） */ }
}
// 別アプリに切り替えて戻ってきたときは、取り直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wakeLock === null) requestWakeLock();
});

// 音を鳴らせる状態にする（iOSは最初のタッチより前に音を出せない）
function unlockAudio(){ Sound.unlock(); }

// 入力欄以外での不要なキー操作を無視（PCで確認するとき用）
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (e.code === 'Space') e.preventDefault();
});

// 起動時の状態を整える（隅のボタンは初期設定画面では出さない）
showScreen('setup');
refreshSetupNote();

// JavaScript が動いていることの確認表示。
//   ここが赤いまま「JavaScript が動いていません」と出ている場合、
//   ボタンを押しても何も起きません（ファイルアプリのプレビューで開くとこうなります）。
const jsCheck = $('jsCheck');
jsCheck.textContent = '起動確認：OK  ' + APP_VERSION;
jsCheck.classList.add('ok');
</script>
